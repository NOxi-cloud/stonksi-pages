name: Secret guard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block obvious embedded secret keys
        shell: bash
        run: |
          set -euo pipefail
          # Scan tracked source files without printing any matching secret.
          if git grep -I -q -E 'sk-proj-[A-Za-z0-9_-]{12,}|sk-[A-Za-z0-9_-]{24,}|sb_secret_[A-Za-z0-9_-]{12,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- '*.js' '*.mjs' '*.ts' '*.json' '*.html' '*.env' '*.yml' '*.yaml'; then
            echo "::error::Potential secret found in tracked source. Remove it and rotate the credential."
            exit 1
          fi
          echo "No obvious embedded secrets found in checked file types."
